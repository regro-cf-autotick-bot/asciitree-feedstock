{% set version = "0.4.0" %}
{% set sha256 = "8041dc6c119c53a3a835b24796dc9ae80d8067f50f100ec71a17645ca814c37b" %}

package:
  name: asciitree
  version: {{ version }}

source:
  fn: asciitree-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/a/asciitree/asciitree-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python
    - setuptools

  run:
    - python

test:
  imports:
    - asciitree

about:
  home: http://github.com/mbr/asciitree
  license: MIT
  license_file: LICENSE
  summary: 'Draws ASCII trees.'

extra:
  recipe-maintainers:
    - kain88-de
    - dotsdl

{% set version = "1.0.0" %}
{% set sha256 = "0c396808c13cab27b60cbe402b99ef37fa681c6b59d337a008719efa201cdd07" %}

package:
  name: asciitree
  version: {{ version }}

source:
  fn: asciitree-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/a/asciitree/asciitree-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python
    - setuptools

  run:
    - python

test:
  imports:
    - asciitree

about:
  home: http://github.com/mbr/asciitree
  license: MIT
  license_file: LICENSE
  summary: 'Draws ASCII trees.'

extra:
  recipe-maintainers:
    - kain88-de
    - dotsdl
